openapi: 3.0.3
info:
  title: Payment Notification API
  description: Serverless API for processing payment notifications using AWS Lambda and API Gateway.
  version: 1.0.0

servers:
  - url: https://1d4fg23413.execute-api.us-east-1.amazonaws.com/prod
    description: Production server

paths:
  /payments:
    post:
      summary: Process a payment notification
      description: Sends payment details and returns a processed transaction response.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - amount
                - sender
                - recipient
              properties:
                amount:
                  type: number
                  example: 25000
                sender:
                  type: string
                  example: "Yetunde Bakare"
                recipient:
                  type: string
                  example: "Kelechi Okafor"

      responses:
        "200":
          description: Payment processed successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: Payment Processed
                  sender:
                    type: string
                    example: Yetunde Bakare
                  recipient:
                    type: string
                    example: Kelechi Okafor
                  amount:
                    type: string
                    example: NGN 25,000.00
                  timestamp:
                    type: string
                    example: "2026-06-09T22:32:20.033680"
                  reference:
                    type: string
                    example: TXN20260609223220

        "400":
          description: Invalid request (e.g. amount <= 0)
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: Invalid amount

        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: Internal server error
